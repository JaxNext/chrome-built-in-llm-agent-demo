<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div>
        Model status:  <span id="model-status" class="status-value">Unkown</span>
        Context usage: <span id="context-usage" class="status-value"></span>
        Context window: <span id="context-window" class="status-value"></span>
    </div>
    <div id="msg-list"></div>
    <input type="text" id="ipt"><button id="sbmt">Send</button>
    <div><button id="printer">Print</button></div>
    <script type="module">

        const ipt = document.querySelector('#ipt')
        const sendBtn = document.querySelector('#sbmt')
        const msgListBox = document.querySelector('#msg-list')
        const modelStatusBox = document.querySelector('#model-status')
        const contextWindowBox = document.querySelector('#context-window')
        const contextUsageBox = document.querySelector('#context-usage')
        const printer = document.querySelector('#printer')

        let modelAvailability = 'Unkown'
        let isCompacting = false
        ipt.disabled = true

        const CONTEXT_WINDOW_THRESHOLD = 0.8
        const COMPACT_RATIO = 0.15

        const tools = [
            {
                name: 'get_age_by_name',
                description: 'Return the age of a person if asked by a name',
                inputSchema: {
                    type: 'object',
                    properties: {
                        name: {
                            type: 'string',
                            description: 'The name of a person'
                        }
                    },
                    required: ['name']
                },
                async execute ({ name }) {
                    if (name === 'Jax') {
                        return 34
                    }
                    return 18
                }
            },
            {
                name: 'get_hobby_by_age',
                description: 'Return the hobby of a person if asked by a age',
                inputSchema: {
                    type: 'object',
                    properties: {
                        age: {
                            type: 'number',
                            description: 'The age of a person'
                        }
                    },
                    required: ['age']
                },
                async execute ({ age }) {
                    if (age >= 30) {
                        return 'Reading'
                    }
                    return 'Playing'
                }
            },
            {
                name: 'get_gift_by_hobby',
                description: 'Return a gift depend on hobby',
                inputSchema: {
                    type: 'object',
                    properties: {
                        hobby: {
                            type: 'string',
                            description: 'A hobby'
                        }
                    },
                    required: ['hobby']
                },
                async execute ({ hobby }) {
                    const giftMap = {
                        'Playing': 'Baseball',
                        'Reading': 'Book'
                    }
                    return giftMap[hobby] || 'Cake'
                }
            }
        ]
        const sessionConfig = {
            // initialPrompts: [
            //     {
            //         role: 'system',
            //         content: 'Use tools and chain of thoughts to help user'
            //     }
            // ],
            expectedInputs: [
                { type: 'tool-response' }
            ],
            expectedOutputs: [
                { type: 'tool-call' }
            ],
            tools
        }

        let msgList = []
        const generateMsgEle = msg => {
            const {
                role,
                content,
                timestamp
            } = msg
            const item = document.createElement('div')
            item.className = `msg-item ${role === 'assistant' ? `msg-item-${timestamp}` : ''}`
            item.dataset.timestamp = timestamp
            item.innerText = `${role}: ${content[0]?.text || content}`
            return item
        }
        const scrollToBottom = () => {
            msgListBox.scrollTop = msgListBox.scrollHeight
        }
        const renderNewMsg = msg => {
            if (!msg?.content?.some(x => x.text)) return
            const item = generateMsgEle(msg)
            msgListBox.appendChild(item)
            scrollToBottom()
        }
        const updateMsgList = msg => {
            msgList.push(msg)
            // if (msg.avoidRender) {
            //     return
            // }
            renderNewMsg(msg)
        }

        const sendMsg = e => {
            if (!ipt.value) {
                return
            }
            updateMsgList({
                role: 'user',
                content: [{
                    type: 'text',
                    value: ipt.value,
                    text: ipt.value
                }],
                timestamp: Date.now()
            })
            ipt.value = ''
            promptModel()
        }

        sendBtn.addEventListener('click', sendMsg)
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                sendMsg()
            }
        })

        printer.addEventListener('click', e => {
            console.log('Message List', msgList);
            
        })

        let originSession = null
        let session = null
        async function checkModelStatus() {
            modelAvailability = await LanguageModel.availability()
            modelStatusBox.innerText = modelAvailability
        }

        async function compactHistory(params) {
            if (isCompacting) {
                return
            }
            isCompacting = true
            console.log('Start compacting', JSON.parse(JSON.stringify(msgList)));
            
            const compactMsg = {
                role: 'user',
                timestamp: Date.now(),
                content: [{
                    type: 'text',
                    value: `Summarize history messages above into one paragraph less than ${session.contextWindow * COMPACT_RATIO} tokens `
                }],
            }
            const result = await promptModel({
                initialContent: 'Compacting...',
                compactMsg,
            })
            msgList = [result]
            console.log('Compacted', JSON.parse(JSON.stringify(msgList)));
            
            session = await originSession.clone()
            updateContextWindow()
            isCompacting = false
        }
        
        async function updateContextWindow() {
            const {
                contextUsage,
                contextWindow
            } = session

            contextUsageBox.innerText = contextUsage
            contextWindowBox.innerText = contextWindow

            if (contextUsage / contextWindow >= CONTEXT_WINDOW_THRESHOLD) {
                await compactHistory()
            }
        }
        
        function formatToolCallMsgText(toolCall) {
            const {
                name,
                callId = '',
                callID = '',
                arguments: toolCallArguments
            } = toolCall
            return `Calling tool ${name} with arguments ${JSON.stringify(toolCallArguments)}`
        }
        
        async function executeToolCall(toolCall) {
            const {
                name,
                callId = '',
                callID = '',
                arguments: toolCallArguments
            } = toolCall
            const toolCallId = callID || callId
            const target = tools.find(x => x.name === name)
            if (!target || !target.execute) {
                return null
            }
            const result = await target.execute(toolCallArguments)
            updateMsgList({
                role: 'user',
                content: [
                    {
                        type: 'tool-response',
                        value: new LanguageModelToolSuccess({
                            name,
                            callId: toolCallId,
                            callID: toolCallId,
                            result: [{
                                type: 'object',
                                value: result,
                            }]
                        }),
                    }
                ],
                timestamp: Date.now(),
                // avoidRender: true, // todo may useless if render 'text' but not 'value'
            })
            await promptModel()
        }
        
        async function promptModel ({
            initialContent = 'Loading...',
            compactMsg = null,
            toolCallResultContent = null,
        } = {}) {
            let textChunks = ''
            const timestamp = Date.now()
            const msg = {
                role: 'assistant',
                content: [{
                    type: 'text',
                    value: initialContent,
                    text: initialContent,
                    isInitial: true
                }],
                timestamp,
            }
            let ele = generateMsgEle(msg)
            msgListBox.appendChild(ele)
            ipt.disabled = true
            const stream = await session.promptStreaming([...msgList, compactMsg].filter(x => !!x))
            let isStringStream = true
            for await (const chunk of stream) {
                let lastContent = msg.content[msg.content.length - 1]

                if (lastContent.isInitial) {
                    lastContent = {
                        type: 'text',
                        value: '',
                        text: '',
                    }
                }

                if (typeof chunk === 'string') {
                    textChunks += chunk
                    lastContent.value = textChunks
                    lastContent.text = textChunks
                    
                    msg.content[msg.content.length - 1] = lastContent
                    ele.innerText = `assistant: ${msg.content.map(x => x.text).join('\n')}`
                } else {
                    textChunks = ''
                    console.log('Streaming', chunk)
                    // handle chunk according to it's type
                    isStringStream = false
                    if (chunk.type === 'tool-call') {
                        lastContent = {
                            ...chunk,
                            text: formatToolCallMsgText(chunk.value)
                        }
                        msg.content[msg.content.length - 1] = lastContent
                        ele.innerText = `assistant: ${msg.content.map(x => x.text).join('\n')}`
                        msgList.push(msg)
                        await executeToolCall(chunk.value)
                    }
                }
                
                
                scrollToBottom()
            }
            
            isStringStream && msgList.push(msg) // todo may useless if render 'text' but not 'value'
            !compactMsg && updateContextWindow()

            ipt.disabled = false
            return msg
        }

        await checkModelStatus()
        if (modelAvailability === 'available') {
            originSession = await LanguageModel.create(sessionConfig)
            session = await originSession.clone()
            updateContextWindow()
            ipt.disabled = false
        }
    </script>
</body>
</html>
